hero:
  badge: КОНСУЛТАЦИИ
  title: Консултации и проследяване на бременност
  intro:
    - Предлагаме цялостно проследяване на бременността - както чрез цялостен
      пакет, така и с индивидуални прегледи според нуждите на всяка жена.
    - Извършваме фетална морфология и всички необходими изследвания, включително
      съвременни пренатални неинвазивни тестове.
    - Извършваме гинекологични и мамологични прегледи и можете да се обърнете
      към нас още на етап планиране на бременност, по време на нея и след
      раждането.
  image: /images/consultations-pregnancy.jpg
  image_alt: Проследяване на бременност
  package_line: Пакет от 12 посещения
  package_price: 550 €
  location: Консултациите се провеждат в болница Свети Лазар, София.
  button: Свържете се
package:
  title: "Пакетът включва:"
  items:
    - Подробна анамнеза и запознаване с медицинската ви история
    - Определяне на вероятния термин за раждане
    - Измерване на кръвно налягане, тегло, височина на матката
    - Определяне на позицията на бебето
    - Записи на детски сърдечни тонове
    - Всички стандартни изследвания — ПКК, биохимия, хемостаза, серология,
      кръвна група, урина
    - Микробиология на влагалищен секрет
    - Съвети за хранене, физическа активност, справяне с неразположения
    - Обсъждане на план за раждане
services:
  title: "Единични услуги:"
team:
  badge: ЕКИП
  title: Екип La Vita Nova
  subtitle: Мултидисциплинарен екип в подкрепа на естественото раждане, ранния
    контакт и кърменето.
  image: /images/team-lavitanova.jpg
  members:
    - name: Олга Дукат
      role: Акушерка · Инструктор, Childbirth International · IBCLC консултант по
        кърмене
      bio: Майка на 4 деца, с над 15 години опит в подготовката за раждане. Подготвила
        е хиляди семейства, помогнала на стотици жени да родят естествено. Автор
        на книгите „Раждане с любов" и „VBAC раждане с любов".
    - name: Д-р Красимир Паликов
      role: Акушер-гинеколог
      bio: Д-р Паликов завършва медицина през 1990 г. Уменията му обхващат наблюдение
        на нормална и рискова бременност, ултразвукова диагностика, нормално и
        оперативно раждане. Извършва фетална морфология и е сред акредитираните
        специалисти в списъка на Fetal Medicine Foundation. Предоставя
        комплексна грижа за женското здраве чрез гинекологични и мамологични
        прегледи. Част от екипа La Vita Nova от 2020 г. Заедно сме асистирали на
        стотици раждания - включително VBAC, седалищни раждания и близнаци.
    - name: Антоанета Константинова
      role: Акушерка
      bio: Присъедини се към екипа през 2025 година. Акушерка с опит, която споделя
        нашите възгледи за естественото раждане.
