testimonials:
  - name: "Вихра"
    stars: "★★★★★"
    text: "Закупих курса „Раждане с Любов\", когато бях в петия месец от бременността. За мен това беше много ценен ресурс, изключително добре структуриран и покриващ всеобхватна информация за периода преди, по време и след раждането. Всяка тема е отделно видео, а съдържанието е така подбрано, че да бъде практично. Първоначално със съпруга ми изгледахме модулите един след друг, после се връщахме към определени теми, когато те ставаха все по-актуални. Бих го препоръчала на всеки бъдещ родител, независимо дали очаква първото си или следващо дете. Спомням си как се питах: „А какво са правили родителите, които са нямали достъп до подобно знание?\""
  - name: "Беатриса"
    stars: "★★★★★"
    text: "Гледах курса в 6-ти месец от бременността ми (първа). Най-полезна ми беше много добре структурираната и стегната информация (особено теорията по отношение на физиологията, както и информацията за процеса на раждане и различните видове евентуални интервенции), практическите насоки и всичко това комбинирано с подхода и енергията на Олга внесе изключително голяма яснота и спокойствие и в двама ни с мъжа ми. Курсът промени нагласата ми по отношение на много аспекти от процеса, внесе яснота и успокоение. И сега след раждането мога да потвърдя, че това е ключово. Изненада ме колко много широко установени практики има по отношение на бременноста и раждането, които всъщност противоречат на физиологичната и рационалната логика. Бих препоръчала курса на абсолютно всяка бременна жена, за да получи цялостна увереност в ресурса и мъдростта на тялото си."
  - name: "Виолетка и Краси"
    stars: "★★★★★"
    text: "Курсът на Олга ми даде пълно спокойствие, че разбирам какво ми предстои по време на един от най-важните моменти в целия ми живот. Много от решенията, които с мъжа ми взехме и ми помогнаха да имам леко раждане се дължат на курса. Информацията е изключително добре структурирана и лесна за намиране. Мъжът ми също много високо оцени ясните насоки и информация. Още от родилното та до ден днешен си ползвам модула за родителство, който се оказа невероятно ценен и пълен с практически видеа и насоки. Препоръчвам всичките модули горещо на всички, които искат да постигнат мечтаното и леко раждане и родителство след това."
  - name: "Мария"
    stars: "★★★★★"
    text: "Закупих си пълния курс с всичките модули, свързани с бременността, раждането, първи грижи и го гледам с голямо удоволствие! Искам само да споделя как още с първото дете мечтаех да раждам естествено, с подкрепа и с присъствие на партньора си, в уютна среда… но за съжаление нямах подкрепа за това. А сега като гледам лекциите и не мога да повярвам, че сега съм наистина поела по този път и точно с вас! То беше естествено раждане, но с особености и в много неестествена обстановка, неестествени за мен насоки за напъни.. не усетих пространството да се свържа с тялото си. А сега съм спокойна че съм в прекрасни ръце, благодаря!"

