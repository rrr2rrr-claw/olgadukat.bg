hero:
  badge: "ОНЛАЙН КУРС ЗА БРЕМЕННИ"
  title: "Информиран избор за раждането и след това"
  subtitle: "Онлайн курс за подготовка за раждането с акушерка Олга Дукат"
  text: "Подгответе се спокойно и уверено за най-важния момент от живота си. 57 видеоурока, над 17 часа практични знания – от бременността до първите дни с бебето."
  image: "/images/olga-3.jpg"

for_whom:
  - title: "Очаквате бебе"
    text: "Независимо дали е първо, второ или трето — всяка бременност е различна и заслужава подготовка."
  - title: "Имате страхове за раждането"
    text: "Страхът идва от незнанието. Курсът ще ви даде яснота и спокойствие."
  - title: "Искате естествено раждане"
    text: "Научете как да подкрепите тялото си и да вземете информирани решения."
  - title: "Искате партньорът ви да участва"
    text: "Разберете заедно как той може да бъде истинска опора по време на раждането."
  - title: "Раждали сте, но искате различно преживяване"
    text: "Подгответе се за раждане, в което вие вземате решенията."
  - title: "Искате да сте максимално информирани"
    text: "Знанието е сила — научете всичко за бременността, раждането и първите дни с бебето."

faq:
  - question: "Колко време имам достъп до курса?"
    answer: "Достъпът е неограничен и можете да гледате лекциите колкото пъти искате."
  - question: "Мога ли да купя само отделен модул?"
    answer: "Да, можете да закупите целия курс или отделни модули според нуждите си."

testimonials:
  - name: "Вихра"
    text: "Курсът ми даде спокойствие и увереност в подготовката за раждането."
  - name: "Виолетка и Краси"
    text: "Благодарим за знанията, подкрепата и човешкото отношение."
