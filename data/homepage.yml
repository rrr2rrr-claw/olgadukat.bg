faq:
  - question: "За кого е курсът?"
    answer: "Курсът е подходящ за бременни жени на всеки етап, за двойки, които искат да се подготвят заедно, и за жени, които планират бременност. Подходящ е и за второ/трето раждане."
  - question: "Колко време имам достъп?"
    answer: "Достъпът до материалите е неограничен. Можете да гледате видеата колкото пъти искате."
  - question: "Мога ли да гледам от телефон?"
    answer: "Да, курсът работи на телефон, таблет и компютър."
  - question: "Курсът подходящ ли е, ако ще раждам с цезарово?"
    answer: "Да. Има специален епизод за цезарово сечение, както и за VBAC (вагинално раждане след секцио). Дори при планирано секцио, подготовката ви помага да се чувствате информирани и спокойни."
  - question: "Мога ли да купя само един модул?"
    answer: "Да, всеки модул може да се закупи отделно."
  - question: "Как плащам?"
    answer: "Плащането е онлайн с банкова карта. След плащането получавате незабавен достъп до курса."
  - question: "Как се доставя книгата?"
    answer: "Книгата се доставя с куриер до адрес по ваш избор."
  - question: "Мога ли да гледам курса с партньора си?"
    answer: "Разбира се! Курсът е създаден и за двамата. Има специален епизод за ролята на бащата по време на раждането."

