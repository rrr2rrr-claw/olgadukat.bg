conditions:
  badge: "УСЛОВИЯ"
  title: "Условия в болница Свети Лазар"
  image: "/images/img_7300.jpg"
  image_alt: "Условия в болница Свети Лазар"
  paragraphs:
    - "По време на раждането присъства екип от лекари - двама акушер-гинеколози, анестезиолог, неонатолог, акушерки. Екипът наблюдава процеса дискретно и ненатрапчиво, осигурява се спокойна и усамотена среда. При неусложнено раждане, раждащите жени се обгрижват основно от акушерки, но има готовност за лекарска намеса в случай на усложнение."
    - "<strong>Неонатологичното отделение</strong> е второ ниво, което означава, че разполага с необходимата апаратура и че единствено недоносени бебета и най-тежките случаи не могат да се поемат в нашата болница."
    - "Цената на раждането зависи от стаята, в която ще бъдете настанени след раждането. Болницата разполага с двойни, единични, луксозни стаи и апартамент. Всяка стая разполага с регулируемо легло, климатик, телевизор, гардероб, маса и столове, баня и тоалетна и вътрешен телефон за връзка с персонала."
    - "<strong>Престоят в болница</strong> е 3 нощувки след естествено раждане и 4 нощувки след секцио. <strong>Подкрепата</strong> за майката и бебето <strong>е денонощна</strong>, а храната е три пъти на ден с избор от меню. <strong>Осигурява се</strong> <strong>всичко необходимо</strong> като нощници, чехли, хавлии, памперси и кърпички за бебето. <strong>Свижданията</strong> са позволени от 8:00 до 22:00. Възможни са <strong>нощувки на придружител</strong> срещу допълнително заплащане."

team:
  badge: "ЕКИП"
  title: "Екип La Vita Nova"
  subtitle: "Мултидисциплинарен екип в подкрепа на естественото раждане, ранния контакт и кърменето."
  image: "/images/team-lavitanova.jpg"
  members:
    - name: "Олга Дукат"
      role: "Акушерка · Инструктор, Childbirth International · IBCLC консултант по кърмене"
      bio: "Майка на 4 деца, с над 15 години опит в подготовката за раждане. Подготвила е хиляди семейства, помогнала на стотици жени да родят естествено. Автор на книгите „Раждане с любов\" и „VBAC раждане с любов\"."
    - name: "Д-р Красимир Паликов"
      role: "Акушер-гинеколог"
      bio: "Д-р Паликов завършва медицина през 1990 г. Уменията му обхващат наблюдение на нормална и рискова бременност, ултразвукова диагностика, нормално и оперативно раждане. Извършва фетална морфология и е сред акредитираните специалисти в списъка на Fetal Medicine Foundation. Предоставя комплексна грижа за женското здраве чрез гинекологични и мамологични прегледи. Част от екипа La Vita Nova от 2020 г. Заедно сме асистирали на стотици раждания - включително VBAC, седалищни раждания и близнаци."
    - name: "Антоанета Константинова"
      role: "Акушерка"
      bio: "Присъедини се към екипа през 2025 година. Акушерка с опит, която споделя нашите възгледи за естественото раждане."

