name: Build homepage

on:
  push:
    branches: [main]
    paths:
      - data/homepage.yml
      - data/pricing.yml
      - scripts/build_homepage.py
      - .github/workflows/build-homepage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pyyaml
      - run: python scripts/build_homepage.py
      - name: Commit generated homepage
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build homepage from Pages CMS data"
          git push
