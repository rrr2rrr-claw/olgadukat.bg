name: Build pages

on:
  push:
    branches: [main]
    paths:
      - data/books.yml
      - data/birth.yml
      - data/consultations.yml
      - data/homepage.yml
      - data/pricing.yml
      - scripts/build_pages.py
      - scripts/build_homepage.py
      - .github/workflows/build-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pyyaml
      - run: python scripts/build_homepage.py
      - run: python scripts/build_pages.py
      - name: Commit generated homepage
        run: |
          if git diff --quiet -- index.html knigi.html konsultatsii.html razhdane-s-nas.html; then
            echo "No page changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html knigi.html konsultatsii.html razhdane-s-nas.html
          git commit -m "Build pages from Pages CMS data"
          git push
