media:
  - name: images
    label: Images
    input: images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, svg]

content:
  - name: quick_content
    label: Quick content
    type: group
    items:
      - name: site_settings
        label: Site settings
        type: file
        path: data/site.yml
        format: yaml
        fields:
          - name: title
            label: Site title
            type: string
            required: true
          - name: description
            label: Meta description
            type: text
            required: true
          - name: domain
            label: Domain
            type: string
            required: true
          - name: contact
            label: Contact
            type: object
            fields:
              - name: email
                label: Email
                type: string
                required: true
              - name: phone
                label: Phone
                type: string
                required: true
              - name: blog
                label: Blog URL
                type: string
              - name: facebook
                label: Facebook URL
                type: string
              - name: instagram
                label: Instagram URL
                type: string
              - name: tiktok
                label: TikTok URL
                type: string
          - name: analytics
            label: Analytics
            type: object
            fields:
              - name: umami_website_id
                label: Umami website ID
                type: string

      - name: pricing
        label: Pricing
        type: file
        path: data/pricing.yml
        format: yaml
        fields:
          - name: course
            label: Course products
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} - {price_eur} EUR"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: description
                label: Description
                type: rich-text
              - name: price_eur
                label: Price EUR
                type: string
                required: true
              - name: price_bgn
                label: Price BGN
                type: string
                required: true
              - name: note
                label: Card note
                type: string
              - name: features
                label: Features
                type: string
                list: true
              - name: button
                label: Button label
                type: string
              - name: label
                label: Card label
                type: string
              - name: purchase_url
                label: Purchase URL
                type: string
                required: true
              - name: featured
                label: Featured
                type: boolean
          - name: books
            label: Books
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} - {price_eur} EUR"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: subtitle
                label: Subtitle
                type: string
              - name: price_eur
                label: Price EUR
                type: string
                required: true
              - name: price_bgn
                label: Price BGN
                type: string
                required: true
              - name: purchase_url
                label: Purchase URL
                type: string
                required: true
              - name: image
                label: Image
                type: image
          - name: consultations
            label: Consultations and services
            type: object
            fields:
              - name: package_title
                label: Package title
                type: string
                required: true
              - name: package_price_eur
                label: Package price EUR
                type: string
                required: true
              - name: package_price_bgn
                label: Package price BGN
                type: string
              - name: services
                label: Single services
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title} - {price_eur} EUR"
                fields:
                  - name: title
                    label: Title
                    type: string
                    required: true
                  - name: price_eur
                    label: Price EUR
                    type: string
                    required: true

